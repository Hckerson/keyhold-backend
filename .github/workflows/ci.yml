name: CI

on:
    push:
        branches: [master, development]
    pull_request:

concurrency:
    group: ${{ github.workflow }}-${{ github.ref }}
    cancel-in-progress: true

jobs:
    verify:
        name: type-check · lint · format · build · test
        runs-on: ubuntu-latest

        services:
            postgres:
                image: postgres:17-alpine
                env:
                    POSTGRES_USER: real_estate
                    POSTGRES_PASSWORD: real_estate
                    POSTGRES_DB: real_estate
                ports:
                    - 5432:5432
                options: >-
                    --health-cmd "pg_isready -U real_estate -d real_estate"
                    --health-interval 5s
                    --health-timeout 5s
                    --health-retries 10

        env:
            DATABASE_URL: postgresql://real_estate:real_estate@localhost:5432/real_estate

        steps:
            - uses: actions/checkout@v4

            - uses: pnpm/action-setup@v4
              with:
                  version: 10

            - uses: actions/setup-node@v4
              with:
                  node-version: 22
                  cache: pnpm

            - name: Install
              run: pnpm install --frozen-lockfile

            - name: Migrate
              run: pnpm db:deploy

            - name: Type-check
              run: pnpm type-check

            - name: Lint
              run: pnpm lint

            - name: Format
              run: npx prettier --check .

            - name: Build
              run: pnpm build

            - name: Test
              run: pnpm test
